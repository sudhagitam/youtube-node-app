<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Archive</title>
    <style>
        :root {
            --bg: #0a0e12;
            --panel: #121b22;
            --primary: #d4af6a;
            --primary-strong: #f0d99a;
            --text: #f7f2e8;
            --muted: #d5c8b5;
            --border: rgba(212, 175, 106, 0.18);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(180deg, #0a0e12 0%, #10181d 100%);
            color: var(--text);
        }

        a { color: inherit; }

        .topbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            flex: 1;
            text-align: center;
            margin: 0;
            font-size: clamp(1.2rem, 2vw, 1.8rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-strong);
            text-decoration: none;
            font-weight: 700;
        }

        .nav-link:hover {
            text-decoration: underline;
        }

        .page-header {
            text-align: center;
            padding: 8px 20px 18px;
        }

        .page-header h2 {
            margin: 0;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        .playlist-group {
            margin-bottom: 36px;
        }

        .playlist-group h3 {
            margin: 0 0 14px;
            color: var(--primary-strong);
            font-size: 1.3rem;
        }

        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .video-wrapper {
            background: linear-gradient(180deg, rgba(18,27,34,0.95), rgba(11,14,18,0.95));
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 12px 26px rgba(0,0,0,0.2);
        }

        .video-title {
            margin: 0 0 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            color: var(--text);
        }

        .video-player {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-player iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }

        @media (max-width: 640px) {
            .topbar {
                flex-wrap: wrap;
                justify-content: center;
            }

            .brand {
                width: 100%;
                order: 2;
            }

            .container {
                padding-left: 14px;
                padding-right: 14px;
            }

            .playlist-grid {
                gap: 14px;
            }

            .video-wrapper {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="index.html" class="nav-link">🏠 Home</a>
        <h1 class="brand">TBCF - Tampa Bay Christian Fellowship</h1>
    </header>

    <section class="page-header">
        <h2>Videos Archive</h2>
    </section>

    <main class="container" id="video-feed">
        <h2 style="text-align: center;">Loading archive...</h2>
    </main>

    <script>
        fetch('/api/videos')
            .then(res => res.json())
            .then(videos => {
                const feed = document.getElementById('video-feed');
                feed.innerHTML = '';

                if (videos.length === 0) {
                    feed.innerHTML = "<h2 style='text-align:center;'>No videos found.</h2>";
                    return;
                }

                const playlists = {};
                videos.forEach(v => {
                    const playlistName = v.playlist || 'General';
                    if (!playlists[playlistName]) {
                        playlists[playlistName] = [];
                    }
                    playlists[playlistName].push(v);
                });

                Object.entries(playlists).forEach(([playlistName, playlistVideos]) => {
                    const section = document.createElement('section');
                    section.className = 'playlist-group';

                    const heading = document.createElement('h3');
                    heading.textContent = playlistName;
                    section.appendChild(heading);

                    const grid = document.createElement('div');
                    grid.className = 'playlist-grid';

                    playlistVideos
                        .sort((a, b) => b.title.localeCompare(a.title))
                        .forEach(v => {
                            const wrapper = document.createElement('div');
                            wrapper.className = 'video-wrapper';
                            wrapper.innerHTML = `
                                <h3 class="video-title">${v.title}</h3>
                                <div class="video-player">
                                    <iframe src="https://www.youtube.com/embed/${v.id}?rel=0" allowfullscreen></iframe>
                                </div>
                            `;
                            grid.appendChild(wrapper);
                        });

                    section.appendChild(grid);
                    feed.appendChild(section);
                });
            })
            .catch(err => console.error("Error loading videos:", err));
    </script>
</body>
</html>
