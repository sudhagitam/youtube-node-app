<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Archive</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        .archive-link { display: inline-block; margin-top: 10px; color: #4da6ff; text-decoration: none; font-size: 1.2rem; }
        .archive-link:hover { text-decoration: underline; }

        /* Grid container for multiple horizontal rows of small videos */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .video-wrapper {
            background-color: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .video-title {
            margin: 0 0 10px 0;
            font-size: 0.95rem;
            color: #e0e0e0;
            line-height: 1.3;
        }
        .video-player {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        .video-player iframe {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            border: none; border-radius: 4px;
        }
    </style>
</head>
<body>

<style>
    body { font-family: sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
    header { margin-bottom: 30px; }
    .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
    }
    .header-row h1 {
        margin: 0;
        flex: 1;
        text-align: center;
    }
    .nav-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #4da6ff;
        text-decoration: none;
        font-size: 1.1rem;
    }
    .nav-link:hover { text-decoration: underline; }
    .archive-link { justify-self: flex-end; }
    .container { max-width: 800px; margin: 0 auto; }
    .video-wrapper { background-color: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
    .video-title { margin: 0 0 15px 0; font-size: 1.3rem; color: #e0e0e0; }
    .video-player { position: relative; padding-bottom: 56.25%; height: 0; }
    .video-player iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; border-radius: 6px; }
</style>

<header class="header-row">
    <a href="index.html" class="nav-link">🏠 Home</a>
    <h1>TBCF Bible Study</h1>
</header>
<header style="grid-column: 1 / -1;">
    <h1>Video Archive</h1>
    </header>

<main class="container" id="video-feed">
    <h2 style="text-align: center; grid-column: 1 / -1;">Loading archive...</h2>
</main>

<script>
    fetch('/api/videos')
        .then(res => res.json())
        .then(videos => {
            const feed = document.getElementById('video-feed');
            feed.innerHTML = '';

            if (videos.length === 0) {
                feed.innerHTML = "<h2 style='text-align:center; grid-column: 1 / -1;'>No videos found.</h2>";
                return;
            }

            // Sort Z to A or A to Z as preferred for archive layout
            videos.sort((a, b) => b.title.localeCompare(a.title));

            // Loop through and display every video in a compact card
            videos.forEach(v => {
                const wrapper = document.createElement('div');
                wrapper.className = 'video-wrapper';
                wrapper.innerHTML = `
                    <h3 class="video-title">${v.title}</h3>
                    <div class="video-player">
                        <iframe src="https://www.youtube.com/embed/${v.id}?rel=0" allowfullscreen></iframe>
                    </div>
                `;
                feed.appendChild(wrapper);
            });
        })
        .catch(err => console.error("Error loading videos:", err));
</script>
</body>
</html>
